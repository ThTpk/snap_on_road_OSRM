<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS Route Builder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085;
    --border: #e3e6eb; --accent: #2563eb; --accent-text: #fff; --danger: #dc2626;
    --route: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e6e9ef; --muted: #98a2b3;
      --border: #2c323d; --accent: #4f8cff; --danger: #f87171; --route: #4f8cff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
    display: grid; grid-template-columns: 340px 1fr; height: 100vh;
  }
  aside {
    background: var(--panel); border-right: 1px solid var(--border);
    padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  }
  h1 { font-size: 18px; margin: 0; }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  select, input[type=text], input[type=number] {
    width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font: inherit;
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button {
    padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .stat b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  #breakdown { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  #breakdown summary { cursor: pointer; font-weight: 600; }
  #breakdown dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin: 8px 0; font-size: 13px; }
  #breakdown dt { color: var(--muted); }
  #breakdown dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  #breakdown .tbl { max-height: 240px; overflow-y: auto; }
  #breakdown table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  #breakdown th, #breakdown td { padding: 3px 4px; border-bottom: 1px solid var(--border); text-align: right; }
  #breakdown th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
  #breakdown th:first-child, #breakdown td:first-child { text-align: left; }
  #breakdown tfoot td { font-weight: 600; border-top: 2px solid var(--border); border-bottom: 0; }
  #status { font-size: 13px; min-height: 1.5em; color: var(--muted); }
  #status.err { color: var(--danger); }
  ol#points { margin: 0; padding-left: 22px; max-height: 220px; overflow-y: auto;
    font-variant-numeric: tabular-nums; font-size: 13px; }
  ol#points li { padding: 2px 0; display: flex; justify-content: space-between; gap: 6px; }
  ol#points li button { padding: 0 6px; font-size: 12px; }
  #map { height: 100vh; }
  .pin {
    background: var(--accent); color: #fff; border: 2px solid #fff; border-radius: 50%;
    width: 24px; height: 24px; display: grid; place-items: center;
    font-size: 12px; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .pin.start { background: #16a34a; }
  .pin.end { background: #dc2626; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    #map { height: 55vh; grid-row: 1; }
    aside { grid-row: 2; border-right: 0; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<aside>
  <div>
    <h1>GPS Route Builder</h1>
    <p class="hint"><a href="api-test.html" style="color:var(--accent)">OSRM API Tester →</a></p>
    <p class="hint">คลิกบนแผนที่เพื่อเพิ่มจุด · ลากหมุดเพื่อย้าย · คลิกขวาที่หมุดเพื่อลบ</p>
  </div>

  <div>
    <label for="mode">โหมด OSRM</label>
    <select id="mode">
      <option value="route">Route: หาเส้นทางผ่านจุดตามลำดับ</option>
      <option value="match">Match: map matching (snap จุด GPS เข้าถนน)</option>
    </select>
  </div>

  <div class="row">
    <div>
      <label for="profile">ประเภท</label>
      <select id="profile">
        <option value="driving">รถยนต์</option>
        <option value="cycling">จักรยาน</option>
        <option value="walking">เดิน</option>
      </select>
    </div>
    <div id="radiusWrap">
      <label for="radius">รัศมี match (m)</label>
      <input id="radius" type="number" min="1" max="100" value="30">
    </div>
  </div>

  <div>
    <label for="server">OSRM server</label>
    <select id="server">
      <option value="https://router.project-osrm.org">router.project-osrm.org (demo, รถยนต์เท่านั้น)</option>
      <option value="https://routing.openstreetmap.de/routed-{profile}">routing.openstreetmap.de (รถ/จักรยาน/เดิน)</option>    </select>
  </div>

  <div>
    <button id="importBtn" style="width:100%">📂 Import CSV (lat,lon)</button>
    <input id="importFile" type="file" accept=".csv,.txt,text/csv" hidden>
    <p class="hint" style="margin-top:4px">หรือลากไฟล์ CSV มาวางบนแผนที่ · ใช้ header ชื่อ lat/lon หรือไม่มี header ก็ได้ (คอลัมน์ 1 = lat, 2 = lon)</p>
  </div>

  <div class="row">
    <button id="undo">↶ ย้อนกลับ</button>
    <button id="clear" class="danger">ล้างทั้งหมด</button>
  </div>

  <div id="status">ยังไม่มีจุด</div>

  <div class="stats">
    <div class="stat"><b id="sDist">–</b><span>ระยะทาง</span></div>
    <div class="stat"><b id="sTime">–</b><span>เวลาโดยประมาณ</span></div>
    <div class="stat"><b id="sIn">0</b><span>จุดที่คลิก</span></div>
    <div class="stat"><b id="sOut">0</b><span>จุดบนเส้นทาง</span></div>
  </div>

  <details id="breakdown" open hidden>
    <summary>สรุประยะทาง</summary>
    <dl id="bdSummary"></dl>
    <div class="tbl"><table id="bdLegs"></table></div>
  </details>

  <div class="row">
    <button id="exportRoute" class="primary" disabled>Export เส้นทาง CSV</button>
    <button id="exportInput" disabled>Export จุดที่คลิก CSV</button>
  </div>

  <div>
    <label>จุดที่คลิก (lat, lon)</label>
    <ol id="points"></ol>
  </div>
</aside>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="csv-import.js"></script>
<script>
const $ = id => document.getElementById(id);

const map = L.map('map').setView([13.7563, 100.5018], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors · Routing &copy; OSRM'
}).addTo(map);

let points = [];        // [{lat, lng, marker}]
let routeCoords = [];   // [[lat, lon], ...] from OSRM
let routeLayer = null;
let reqId = 0;
let timer = null;
let importNote = '';    // shown in front of the status until the points are edited by hand

// ---------- points ----------
function addPoint(latlng, silent = false) {
  const marker = L.marker(latlng, { draggable: true }).addTo(map);
  const p = { lat: latlng.lat, lng: latlng.lng, marker };
  marker.on('dragend', e => {
    const ll = e.target.getLatLng();
    p.lat = ll.lat; p.lng = ll.lng;
    refresh();
  });
  marker.on('contextmenu', () => removePoint(p));
  points.push(p);
  if (!silent) refresh();
}

function removePoint(p) {
  map.removeLayer(p.marker);
  points = points.filter(x => x !== p);
  refresh();
}

function refresh() {
  points.forEach((p, i) => {
    const cls = i === 0 ? 'start' : (i === points.length - 1 && points.length > 1 ? 'end' : '');
    p.marker.setIcon(L.divIcon({
      className: '', html: `<div class="pin ${cls}">${i + 1}</div>`,
      iconSize: [24, 24], iconAnchor: [12, 12]
    }));
  });
  $('sIn').textContent = points.length;
  $('exportInput').disabled = points.length === 0;
  $('points').innerHTML = points.map((p, i) =>
    `<li><span>${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</span><button data-i="${i}" title="ลบ">✕</button></li>`
  ).join('');
  scheduleRoute();
}

$('points').addEventListener('click', e => {
  const i = e.target.dataset.i;
  if (i !== undefined) removePoint(points[+i]);
});

map.on('click', e => { importNote = ''; addPoint(e.latlng); });

// ---------- CSV import ----------
async function importCsv(file) {
  if (!file) return;
  try {
    const { points: rows, skipped, swapped } = await readLatLonCsvFile(file);
    if (points.length && !confirm(`แทนที่ ${points.length} จุดเดิมด้วย ${rows.length} จุดจากไฟล์ ${file.name}?`)) return;
    points.forEach(p => map.removeLayer(p.marker));
    points = [];
    rows.forEach(([lat, lon]) => addPoint(L.latLng(lat, lon), true));
    refresh();
    map.fitBounds(rows, { padding: [40, 40] });

    const notes = [`Import ${rows.length} จุดจาก ${file.name}`];
    if (skipped) notes.push(`ข้าม ${skipped} แถวที่อ่านไม่ได้`);
    if (swapped) notes.push('สลับคอลัมน์ให้แล้ว (ไฟล์เป็น lon,lat)');
    if (rows.length > 100 && $('mode').value === 'route') notes.push('จุดเยอะ ถ้าเป็น GPS log แนะนำโหมด Match');
    importNote = notes.join(' · ');
    setStatus('');
  } catch (err) {
    setStatus('Import ไม่สำเร็จ: ' + err.message, true);
  }
}

$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = e => { importCsv(e.target.files[0]); e.target.value = ''; };
const mapEl = $('map');
mapEl.addEventListener('dragover', e => { e.preventDefault(); mapEl.style.outline = '3px dashed var(--accent)'; });
mapEl.addEventListener('dragleave', () => mapEl.style.outline = '');
mapEl.addEventListener('drop', e => {
  e.preventDefault();
  mapEl.style.outline = '';
  importCsv(e.dataTransfer.files[0]);
});
$('undo').onclick = () => points.length && removePoint(points[points.length - 1]);
$('clear').onclick = () => { importNote = ''; points.forEach(p => map.removeLayer(p.marker)); points = []; refresh(); };
['mode', 'profile', 'radius', 'server'].forEach(id => $(id).addEventListener('change', () => {
  $('radiusWrap').style.visibility = $('mode').value === 'match' ? 'visible' : 'hidden';
  scheduleRoute();
}));
$('radiusWrap').style.visibility = 'hidden';

// ---------- OSRM ----------
function scheduleRoute() {
  clearTimeout(timer);
  timer = setTimeout(fetchRoute, 250);
}

function setStatus(msg, err = false) {
  $('status').textContent = [importNote, msg].filter(Boolean).join(' · ');
  $('status').className = err ? 'err' : '';
}

function clearRoute() {
  if (routeLayer) map.removeLayer(routeLayer);
  routeLayer = null;
  routeCoords = [];
  $('sDist').textContent = '–';
  $('sTime').textContent = '–';
  $('sOut').textContent = 0;
  $('exportRoute').disabled = true;
  $('breakdown').hidden = true;
}

function buildUrl() {
  const mode = $('mode').value;
  const profile = $('profile').value;
  const coords = points.map(p => `${p.lng.toFixed(6)},${p.lat.toFixed(6)}`).join(';');
  let base = $('server').value;
  // routing.openstreetmap.de uses a separate server per profile
  const osmdeProfile = { driving: 'car', cycling: 'bike', walking: 'foot' }[profile];
  base = base.replace('{profile}', osmdeProfile);
  const params = new URLSearchParams({ geometries: 'geojson', overview: 'full' });
  if (mode === 'match') {
    const r = Math.max(1, Math.min(100, +$('radius').value || 30));
    params.set('radiuses', points.map(() => r).join(';'));
    params.set('gaps', 'ignore');
  }
  return `${base}/${mode}/v1/${profile}/${coords}?${params}`;
}

async function fetchRoute() {
  if (points.length < 2) {
    clearRoute();
    setStatus(points.length ? 'คลิกเพิ่มอีกอย่างน้อย 1 จุด' : 'ยังไม่มีจุด');
    return;
  }
  if ($('mode').value === 'match' && points.length > 100) {
    setStatus('โหมด match รองรับสูงสุด 100 จุดต่อ request', true);
    return;
  }
  const id = ++reqId;
  setStatus('กำลังคำนวณเส้นทาง…');
  try {
    const res = await fetch(buildUrl());
    const data = await res.json();
    if (id !== reqId) return; // a newer request is in flight
    if (data.code !== 'Ok') throw new Error(data.message || data.code);

    const legs = data.routes || data.matchings;
    // OSRM repeats the shared point at leg boundaries; drop consecutive duplicates
    routeCoords = legs.flatMap(r => r.geometry.coordinates.map(([lon, lat]) => [lat, lon]))
      .filter((c, i, a) => i === 0 || c[0] !== a[i - 1][0] || c[1] !== a[i - 1][1]);
    const dist = legs.reduce((s, r) => s + r.distance, 0);
    const dur = legs.reduce((s, r) => s + r.duration, 0);

    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.polyline(routeCoords, {
      color: getComputedStyle(document.documentElement).getPropertyValue('--route').trim(),
      weight: 5, opacity: .85
    }).addTo(map);

    $('sDist').textContent = fmtDist(dist);
    $('sTime').textContent = fmtDuration(dur);
    $('sOut').textContent = routeCoords.length;
    $('exportRoute').disabled = false;
    renderBreakdown(data, legs, dist, dur);

    const note = data.matchings && data.matchings.length > 1
      ? ` (แยกเป็น ${data.matchings.length} ช่วง เพราะบางจุดต่อกันไม่ได้)` : '';
    setStatus('เส้นทางพร้อมแล้ว' + note);
  } catch (err) {
    if (id !== reqId) return;
    clearRoute();
    setStatus('OSRM error: ' + err.message, true);
  }
}

function fmtDist(m) {
  return m >= 1000 ? (m / 1000).toFixed(2) + ' km' : Math.round(m) + ' m';
}

// Sum of great-circle distances along a [[lat, lon], ...] path
function pathLength(coords) {
  let d = 0;
  for (let i = 1; i < coords.length; i++) d += haversine(coords[i - 1], coords[i]);
  return d;
}

function renderBreakdown(data, parts, roadDist, dur) {
  // Haversine is summed per route/matching so gaps between matchings are not counted
  const geomDist = parts.reduce((s, r) =>
    s + pathLength(r.geometry.coordinates.map(([lon, lat]) => [lat, lon])), 0);
  const clicked = points.map(p => [p.lat, p.lng]);

  // Map each leg to the clicked points it connects. /route: waypoint i = point i.
  // /match: unmatched points (tracepoint null) are skipped, so collect indices per matching.
  const legRows = [];
  if (data.routes) {
    data.routes[0].legs.forEach((l, i) => legRows.push({ l, a: i, b: i + 1 }));
  } else {
    data.matchings.forEach((m, mi) => {
      const idx = data.tracepoints
        .map((t, i) => t && t.matchings_index === mi ? { i, w: t.waypoint_index } : null)
        .filter(Boolean).sort((x, y) => x.w - y.w).map(x => x.i);
      m.legs.forEach((l, k) => legRows.push({ l, a: idx[k], b: idx[k + 1] }));
    });
  }

  let cum = 0, sumStraight = 0;
  const body = legRows.map(({ l, a, b }) => {
    cum += l.distance;
    const s = a != null && b != null ? haversine(clicked[a], clicked[b]) : null;
    if (s != null) sumStraight += s;
    return `<tr><td>${a + 1}→${b + 1}</td><td>${fmtDist(l.distance)}</td><td>${fmtDuration(l.duration)}</td>` +
      `<td>${s == null ? '–' : fmtDist(s)}</td><td>${fmtDist(cum)}</td></tr>`;
  }).join('');
  $('bdLegs').innerHTML =
    '<thead><tr><th>ช่วง</th><th>ถนน</th><th>เวลา</th><th>เส้นตรง</th><th>สะสม</th></tr></thead>' +
    `<tbody>${body}</tbody>` +
    `<tfoot><tr><td>รวม</td><td>${fmtDist(cum)}</td><td>${fmtDuration(dur)}</td><td>${fmtDist(sumStraight)}</td><td></td></tr></tfoot>`;

  // Straight-line distance only over legs that have a road route, so unmatched points don't skew the ratio
  const diff = roadDist ? (geomDist - roadDist) / roadDist * 100 : 0;
  const unmatched = data.tracepoints ? data.tracepoints.filter(t => !t).length : 0;
  const rows = [
    ['ระยะทางตามถนน (OSRM)', `<b>${fmtDist(roadDist)}</b>`],
    [`คำนวณจากพิกัดเส้นทาง (Haversine, ${routeCoords.length} จุด)`, `${fmtDist(geomDist)} <span style="color:var(--muted)">(${diff >= 0 ? '+' : ''}${diff.toFixed(2)}%)</span>`],
    [`ระยะเส้นตรงระหว่างจุด (${legRows.length} ช่วง)`, fmtDist(sumStraight)],
    ['อัตราอ้อม (ถนน ÷ เส้นตรง)', sumStraight ? '×' + (roadDist / sumStraight).toFixed(2) : '–'],
    ['ความเร็วเฉลี่ย', dur ? (roadDist / dur * 3.6).toFixed(1) + ' km/h' : '–'],
  ];
  if (unmatched) rows.push(['จุดที่ match กับถนนไม่ได้', `<span style="color:var(--danger)">${unmatched} จุด</span>`]);
  $('bdSummary').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  $('breakdown').hidden = false;
}

function fmtDuration(s) {
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h ? `${h} ชม. ${m} นาที` : `${m} นาที`;
}

// ---------- CSV export ----------
function haversine([lat1, lon1], [lat2, lon2]) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function download(name, rows) {
  const csv = '﻿' + rows.map(r => r.join(',')).join('\r\n'); // BOM for Excel
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

function stamp() {
  return new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
}

$('exportRoute').onclick = () => {
  let cum = 0;
  const rows = [['seq', 'lat', 'lon', 'cum_distance_m']];
  routeCoords.forEach((c, i) => {
    if (i) cum += haversine(routeCoords[i - 1], c);
    rows.push([i + 1, c[0].toFixed(6), c[1].toFixed(6), cum.toFixed(1)]);
  });
  download(`route_${$('mode').value}_${stamp()}.csv`, rows);
};

$('exportInput').onclick = () => {
  const rows = [['seq', 'lat', 'lon']];
  points.forEach((p, i) => rows.push([i + 1, p.lat.toFixed(6), p.lng.toFixed(6)]));
  download(`input_points_${stamp()}.csv`, rows);
};
</script>
</body>
</html>
